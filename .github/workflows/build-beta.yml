
name: Anime Fissure - Build Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "default.project.json"
      - ".github/workflows/build-beta.yml"

permissions:
  contents: read

jobs:
  build:
    name: Gerar Anime Fissure Beta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxe Luau de todos os scripts
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/luau-0.690"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.690/luau-ubuntu.zip -o "$tools_dir/luau.zip"
          unzip -q "$tools_dir/luau.zip" -d "$tools_dir"
          compiler="$tools_dir/luau-compile"
          test -f "$compiler"
          chmod +x "$compiler"
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            if ! "$compiler" --null "$file"; then
              echo "::error file=$file::Falha de compilacao Luau"
              failed=$((failed+1))
            fi
          done < <(find src -type f \( -name '*.luau' -o -name '*.lua' \) -print0)
          echo "Luau: $count scripts verificados; $failed falhas"
          test "$count" -gt 0
          test "$failed" -eq 0

      - name: Instalar Rojo
        run: |
          cargo install rojo --version 7.5.1 --locked
          rojo --version

      - name: Validar arquivos
        run: |
          test -f default.project.json
          test -f src/first/FissureLoading.client.luau
          test -f src/server/GroundedWorld.server.luau
          test -f src/server/Main.server.luau
          test -f src/server/BetaBridge.server.luau
          test -f src/server/BetaLobby.server.luau
          test -f src/shared/UniversalRelicCatalog.luau
          test -f src/server/UniversalRelicAuthoritySmokeTest.server.luau
          test -f src/server/BabylonHallBuilder.luau
          test -f src/server/BabylonHall.server.luau
          test -f src/server/BabylonHallSmokeTest.server.luau
          test -f src/client/BabylonHallVFX.client.luau
          test -f src/client/BetaLobby.client.luau
          test -f src/shared/LobbyStageConfig.luau
          test -f src/server/LobbyAtrium.server.luau
          test -f src/server/LobbyVisualPolish.server.luau
          test -f src/server/NPCResidents.server.luau
          test -f src/shared/LobbyServiceConfig.luau
          test -f src/shared/LobbyNPCArtFinish.luau
          test -f src/server/LobbyNPCArtSmokeTest.server.luau
          test -f src/client/LobbyMentorVFX.client.luau
          test -f src/client/LobbyStudioAudit.client.luau
          test -f src/client/LobbyNavigator.client.luau
          test -f src/server/DemoReleaseSmokeTest.server.luau
          test -f src/client/PostMatchHUD.client.luau
          test -f src/shared/UnitIndexCatalog.luau
          test -f src/client/DanteUnitIndex.client.luau
          test -f src/server/DanteUnitIndexSmokeTest.server.luau
          test -f src/server/LobbyServiceBuilder.luau
          test -f src/server/LobbyServiceStations.server.luau
          test -f src/client/LobbyServiceStationsUI.client.luau
          test -f src/server/LobbyServiceStationsSmokeTest.server.luau
          test -f src/server/BetaMap.server.luau
          test -f src/server/CarneVillageArtPass.luau
          test -f src/server/CarneVillageArtPass.server.luau
          test -f src/server/CarneVillageArtSmokeTest.server.luau
          test -f src/server/EnemyModelBuilder.luau
          test -f src/server/EnemyService.luau
          test -f src/server/TowerService.luau
          test -f src/server/TowerModelBuilder.luau
          test -f src/server/OverlordCombatPrototype.luau
          test -f src/server/OverlordCombatSmokeTest.server.luau
          test -f src/server/OverlordBalanceSmokeTest.server.luau
          test -f src/server/OverlordPairSynergySmokeTest.server.luau
          test -f src/client/TowerHUD.client.luau
          test -f src/client/OverlordCombatVFX.client.luau
          test -f src/client/OverlordCombatAnimator.client.luau
          test -f src/shared/TowerConfig.luau
          test -f src/shared/OverlordBalanceConfig.luau
          test -f src/shared/OverlordUnitRoster.luau
          test -f src/shared/OverlordAbilityDesign.luau
          test -f src/shared/OverlordModelProgression.luau
          test -f src/shared/OverlordPairSynergy.luau
          test -f src/shared/TowerAttackInfo.luau
          test -f src/shared/OverlordTowerModelBuilder.luau
          test -f src/shared/OverlordModelFinish.luau
          test -f src/shared/OverlordMotionController.luau
          test -f src/shared/OverlordCharacterArtPass.luau
          test -f src/shared/EconomyVisualConfig.luau
          test -f src/shared/EconomyItemModelBuilder.luau
          test -f src/server/EconomyModels.server.luau
          test -f src/server/EconomyModelSmokeTest.server.luau
          test -f src/client/EconomyModelGallery.client.luau
          test -f src/client/EconomyItemVFX.luau
          test -f src/server/OverlordModels.server.luau
          test -f src/server/OverlordModelSmokeTest.server.luau
          test -f src/server/OverlordAnimationSmokeTest.server.luau
          test -f src/client/OverlordModelGallery.client.luau
          test -f src/server/ArenaCombatVisuals.server.luau
          test -f src/shared/EnemyConfig.luau
          test -f src/shared/BossConfig.luau
          test -f src/server/BossService.luau
          test -f src/client/Main.client.luau
          test -f src/client/BetaHUD.client.luau
          test -f src/client/StageIntelPanel.luau
          test -f src/shared/StageInfoConfig.luau
          test -f src/shared/StoryRewardConfig.luau
          test -f src/shared/OverlordEvolutionLootConfig.luau
          test -f src/shared/RelicRingConfig.luau
          test -f src/shared/RelicRingModelBuilder.luau
          test -f src/client/RelicRingGallery.client.luau
          test -f src/client/RelicRingEquipVisuals.client.luau
          test -f src/server/RelicRingModels.server.luau
          test -f src/server/RelicRingSmokeTest.server.luau
          test -f src/server/OverlordEvolutionLootSmokeTest.server.luau
          test -f src/client/SummonCinematic.client.luau
          test -f src/shared/GameConfig.luau
          test -f src/shared/GuardianBuilder.luau

      - name: Garantir Overlord em modo teste e Ainz fora do banner
        run: |
          grep -q 'StudioLabYen = 18000' src/shared/TowerConfig.luau
          grep -q 'RunService:IsStudio()' src/server/OverlordCombatPrototype.luau
          grep -q 'def.StudioOnly == true and not RunService:IsStudio()' src/server/TowerService.luau
          grep -q 'AttackFX' src/server/TowerService.luau
          grep -q 'BannerCandidate = false' src/shared/OverlordUnitRoster.luau
          grep -q 'BannerCandidate = true' src/shared/OverlordUnitRoster.luau
          if grep -q 'OVL_Ainz' src/shared/SummonConfig.luau; then
            echo "ERRO: Ainz nao pode estar no banner"
            exit 1
          fi
          if grep -q 'OVL_Climb' src/shared/SummonConfig.luau; then
            echo "ERRO: banner real deve aguardar configuracao de chances"
            exit 1
          fi

      - name: Validar tokens visuais sem mexer no Summon
        run: |
          grep -q 'Currency = "SummonTickets"' src/shared/SummonConfig.luau
          grep -q 'FissureGems' src/shared/EconomyVisualConfig.luau
          grep -q 'TraitRerollCore' src/shared/EconomyVisualConfig.luau
          grep -q 'RelicTraitSeal' src/shared/EconomyVisualConfig.luau
          grep -q 'return false' src/shared/EconomyVisualConfig.luau
          grep -q 'RunService:IsStudio()' src/server/EconomyModels.server.luau

      - name: Conferir modelos 3D detalhados e VFX de economia
        run: |
          grep -q 'Builder.Version = "0.2.0"' src/shared/EconomyItemModelBuilder.luau
          grep -q 'diamond(model,"BlueCrystal"' src/shared/EconomyItemModelBuilder.luau
          grep -q 'CoinFaceFront' src/shared/EconomyItemModelBuilder.luau
          grep -q 'ArmorHex' src/shared/EconomyItemModelBuilder.luau
          grep -q 'OctagonalRuneArmor' src/shared/EconomyItemModelBuilder.luau
          grep -q 'function FX.Attach' src/client/EconomyItemVFX.luau
          grep -q 'ItemVFX.Attach' src/client/EconomyModelGallery.client.luau
          grep -q 'VFX ON' src/client/EconomyModelGallery.client.luau

      - name: Conferir fidelidade artistica sem quebrar jogabilidade
        run: |
          grep -q 'Art.Version="0.8.0"' src/server/CarneVillageArtPass.luau
          grep -q 'CarneVillageArtPass' src/server/CarneVillageArtPass.server.luau
          grep -q 'Art.Version="0.8.0"' src/shared/OverlordCharacterArtPass.luau
          grep -q 'CharacterArt.Apply(model)' src/shared/OverlordTowerModelBuilder.luau
          grep -q 'CanCollide=false' src/server/CarneVillageArtPass.luau
          grep -q 'CanQuery=false' src/shared/OverlordCharacterArtPass.luau
          grep -q 'OVERLORD MODEL TESTE ESTATICO OK' src/server/OverlordModelSmokeTest.server.luau
          grep -q 'CARNE VILLAGE ART TEST OK' src/server/CarneVillageArtSmokeTest.server.luau

      - name: Verificar animacoes e armas Overlord v0.9
        run: |
          grep -q 'Motor6D.Transform' src/shared/OverlordMotionController.luau
          grep -q 'RunService.PreSimulation:Connect' src/client/OverlordCombatAnimator.client.luau
          grep -q 'ModelFinish.Apply(model)' src/shared/OverlordTowerModelBuilder.luau
          grep -q 'WeaponFocus' src/shared/OverlordModelFinish.luau
          grep -q 'Serial = t.Serial' src/server/TowerService.luau
          grep -q 'previewMotion:Attack' src/client/OverlordModelGallery.client.luau
          grep -q 'OVERLORD ANIMATION SMOKE OK' src/server/OverlordAnimationSmokeTest.server.luau

      - name: Validar painel de Tower e sinergia Albedo/Ainz
        run: |
          grep -q 'Pair.HasPair(state.Owners)' src/server/TowerService.luau
          grep -q 'Pair.GetMultiplier(t.Id, pairActive)' src/server/TowerService.luau
          grep -q 'SynergyActive' src/server/TowerService.luau
          grep -q 'EffectiveDamage' src/server/TowerService.luau
          grep -q 'AttackInfo.Get' src/server/TowerService.luau
          grep -q 'UpgradeDot_' src/client/TowerHUD.client.luau
          grep -q 'ATTACK:' src/client/TowerHUD.client.luau
          grep -q 'DEVOÇÃO AO SUPREMO' src/client/TowerHUD.client.luau
          grep -q 'PAIR SYNERGY + INFO SMOKE OK' src/server/OverlordPairSynergySmokeTest.server.luau
          if grep -q 'OVL_Ainz' src/shared/SummonConfig.luau; then
            echo "ERRO: Ainz nao pode entrar no banner"
            exit 1
          fi

      - name: Validar hierarquia de balanceamento Overlord v1
        run: |
          grep -q 'Balance.Version = "0.1.0"' src/shared/OverlordBalanceConfig.luau
          grep -q 'Level1Damage=1000' src/shared/OverlordBalanceConfig.luau
          grep -q 'Level1Damage=700' src/shared/OverlordBalanceConfig.luau
          grep -q 'return OverlordBalance.GetStats(id, level)' src/shared/TowerConfig.luau
          grep -q 'OVERLORD BALANCE SMOKE OK' src/server/OverlordBalanceSmokeTest.server.luau
          grep -q 'StudioOverlordOnly = true' src/shared/TowerConfig.luau
          if grep -q 'OVL_Ainz' src/shared/SummonConfig.luau; then
            echo "ERRO: Ainz nao deve ser adicionado ao banner"
            exit 1
          fi

      - name: Conferir itens de evolucao previstos do Overlord
        run: |
          grep -q 'Loot.Status = "Planned_NoActiveDrops"' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'MagicPowerRing' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'ShalltearEvolutionItem' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'AlbedoEvolutionItem' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'RestrictionRing' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'return false' src/shared/OverlordEvolutionLootConfig.luau
          grep -q 'PlannedEvolutionItems' src/shared/StageInfoConfig.luau
          grep -q 'EVOLUCAO / RELIQUIAS • PLANEJADOS' src/client/StageIntelPanel.luau
          grep -q 'OVERLORD EVOLUTION LOOT TEST OK' src/server/OverlordEvolutionLootSmokeTest.server.luau

      - name: Validar relíquias de evolução e buffs apenas fora do Ainz
        run: |
          grep -q 'Rings.SlotsPerTower=1' src/shared/RelicRingConfig.luau
          grep -q 'unitId=="OVL_Ainz"' src/shared/RelicRingConfig.luau
          grep -q 'result.Damage=math.floor(result.Damage\*1.20' src/shared/RelicRingConfig.luau
          grep -q 'result.SPA=math.floor(result.SPA\*2' src/shared/RelicRingConfig.luau
          grep -q 'return Rings.ApplyStats(stats,t.Id,def.Element,t.RelicId)' src/server/TowerService.luau
          grep -q 'action == "EquipRelic"' src/server/TowerService.luau
          grep -q 'not RunService:IsStudio()' src/server/TowerService.luau
          grep -q 'CycleRelic' src/client/TowerHUD.client.luau
          grep -q 'Builder.BuildAll(ReplicatedStorage)' src/server/RelicRingModels.server.luau
          grep -q 'RELIC RINGS STUDIO OK' src/server/RelicRingSmokeTest.server.luau

      - name: Validar Babilonia, arsenais geek e acesso seguro ao catalogo
        run: |
          grep -q 'Hall.PortalCount=11' src/server/BabylonHallBuilder.luau
          grep -q 'Hall.RingCount=5' src/server/BabylonHallBuilder.luau
          grep -q 'local PORTALS: {PortalDef}' src/server/BabylonHallBuilder.luau
          grep -q 'BabylonRelicPrompt' src/server/BabylonHallBuilder.luau
          grep -q 'Only attach to existing FissureLobby' src/server/BabylonHallBuilder.luau
          grep -q 'Builder.Build(lobby)' src/server/BabylonHall.server.luau
          grep -q 'RelicRingModelBuilder' src/server/BabylonHallBuilder.luau
          grep -q 'Builder.Build(selected.Id)' src/client/RelicRingGallery.client.luau
          grep -q 'prompt.Triggered:Connect' src/server/BabylonHall.server.luau
          grep -q 'maxAnimated=if UserInputService.TouchEnabled then 4 else 9' src/client/BabylonHallVFX.client.luau
          grep -q 'BABYLON HALL SMOKE OK' src/server/BabylonHallSmokeTest.server.luau

      - name: Garantir Gilgamesh como autoridade exclusiva das reliquias
        run: |
          grep -q 'Catalog.OwnerNPC="Gilgamesh"' src/shared/UniversalRelicCatalog.luau
          grep -q 'Catalog.Scope="AllWorlds"' src/shared/UniversalRelicCatalog.luau
          grep -q 'LegacyConcept' src/shared/UniversalRelicCatalog.luau
          grep -q 'RelicScope","AllWorlds"' src/server/BabylonHallBuilder.luau
          grep -q 'OpenRelicCatalog' src/server/BabylonHall.server.luau
          grep -q 'OnClientEvent:Connect' src/client/RelicRingGallery.client.luau
          grep -q 'UniversalRelicCatalog' src/client/RelicRingGallery.client.luau
          grep -q 'OrbsAlchemyOnly' src/server/AlchemyWorkshop.server.luau
          grep -q 'ORBES  -  ALQUIMIA' src/server/AlchemyWorkshop.server.luau
          grep -q 'ORBES  /  TRANSMUTACAO' src/server/LobbyVisualPolish.server.luau
          grep -q 'EDWARD ALCHEMY v0.2' src/client/AlchemyHUD.client.luau
          if grep -q 'RelicIndexConfig' src/client/AlchemyHUD.client.luau; then
            echo "ERRO: Edward ainda referencia o catalogo de reliquias"
            exit 1
          fi
          if grep -q 'OwnedRelics' src/server/AlchemyGateway.server.luau; then
            echo "ERRO: Edward ainda fornece dados de relíquias"
            exit 1
          fi
          if grep -q 'local launch=button' src/client/RelicRingGallery.client.luau; then
            echo "ERRO: catalogo de Gilgamesh ainda pode abrir fora do NPC"
            exit 1
          fi
          grep -q 'GILGAMESH EXCLUSIVE RELIC AUTHORITY OK' src/server/UniversalRelicAuthoritySmokeTest.server.luau

      - name: Validar mentores multiversais e praca sazonal
        run: |
          grep -q 'NPC="Whis"' src/shared/LobbyServiceConfig.luau
          grep -q 'NPC="Kisuke Urahara"' src/shared/LobbyServiceConfig.luau
          grep -q 'NPC="Sung Jinwoo"' src/shared/LobbyServiceConfig.luau
          grep -q 'Config.CurrentEventId=nil' src/shared/LobbyServiceConfig.luau
          grep -q 'ApprovedForRelease=false' src/shared/LobbyServiceConfig.luau
          grep -q 'Config.EventHub.Position' src/server/LobbyServiceStationsSmokeTest.server.luau
          grep -q 'Builder.Build(lobby)' src/server/LobbyServiceStations.server.luau
          grep -q 'root.Position-anchor.Position' src/server/LobbyServiceStations.server.luau
          grep -q 'OpenServiceInfo' src/server/LobbyServiceStations.server.luau
          grep -q 'OnClientEvent:Connect' src/client/LobbyServiceStationsUI.client.luau
          grep -q 'LOBBY SERVICE NETWORK SMOKE OK' src/server/LobbyServiceStationsSmokeTest.server.luau
          grep -q 'APRIMORAR' src/client/RelicRingGallery.client.luau
          if grep -q '"EVOLUIR"' src/client/RelicRingGallery.client.luau; then
            echo "ERRO: Evolucao de personagens deve ser exclusiva do Whis"
            exit 1
          fi

      - name: Validar Dante Index ao lado do Vergil e Jinwoo com raids
        run: |
          grep -q 'Id="Index",NPC="Dante"' src/shared/LobbyServiceConfig.luau
          grep -q 'Position=Vector3.new(247,0,-8)' src/shared/LobbyServiceConfig.luau
          grep -q 'NPC="Sung Jinwoo"' src/shared/LobbyServiceConfig.luau
          grep -q 'Catalog.OwnerNPC="Dante"' src/shared/UnitIndexCatalog.luau
          grep -q 'Catalog.CollectionConnected=false' src/shared/UnitIndexCatalog.luau
          grep -q 'Overlord.GetAll()' src/shared/UnitIndexCatalog.luau
          grep -q 'Catalog.GetOwnershipState' src/shared/UnitIndexCatalog.luau
          grep -q 'kind=="Index"' src/server/LobbyServiceBuilder.luau
          grep -q '"IndexStation"' src/server/LobbyServiceStationsSmokeTest.server.luau
          grep -q 'if id=="Index" then return end' src/client/LobbyServiceStationsUI.client.luau
          grep -q 'OpenServiceInfo' src/client/DanteUnitIndex.client.luau
          grep -q 'DANTE UNIVERSAL INDEX SMOKE OK' src/server/DanteUnitIndexSmokeTest.server.luau
          if grep -q 'FireServer(' src/client/DanteUnitIndex.client.luau; then
            echo "ERRO: o Index de Dante nao pode escrever no servidor"
            exit 1
          fi

      - name: Auditar detalhes dos sete NPCs e efeitos de lobby
        run: |
          grep -q 'Art.Version="1.0.0"' src/shared/LobbyNPCArtFinish.luau
          grep -q 'Art.ApplyService(npc,kind,frame,station)' src/server/LobbyServiceBuilder.luau
          grep -q 'NPCArt.ApplyGilgamesh(folder,facing)' src/server/BabylonHallBuilder.luau
          grep -q 'CrimsonLongCoat' src/server/LobbyServiceBuilder.luau
          grep -q 'DanteBangs_' src/shared/LobbyNPCArtFinish.luau
          grep -q 'FoldedFanLeaf_' src/shared/LobbyNPCArtFinish.luau
          grep -q 'ObsidianPauldron_' src/shared/LobbyNPCArtFinish.luau
          grep -q 'NeckRingPremium' src/shared/LobbyNPCArtFinish.luau
          grep -q 'BabylonGoldSigil' src/shared/LobbyNPCArtFinish.luau
          grep -q 'twinHunterEmblem(root)' src/server/LobbyServiceBuilder.luau
          grep -q 'PREMIUM LOBBY ART SMOKE OK' src/server/LobbyNPCArtSmokeTest.server.luau
          grep -q 'LOBBY MENTOR FX:' src/client/LobbyMentorVFX.client.luau
          grep -q 'ClientOnlyMentorGlow' src/client/LobbyMentorVFX.client.luau
          grep -q 'proximity-LOD' src/client/LobbyMentorVFX.client.luau
          grep -q 'LOBBY STUDIO DIAGNOSTIC ready' src/client/LobbyStudioAudit.client.luau
          grep -q 'OpenDialogue' src/client/LobbyStudioAudit.client.luau

      - name: Revisar QoL de lobby, mobile e arena - Demo final
        run: |
          grep -q 'AnimeFissureLobbyNavigator' src/client/LobbyNavigator.client.luau
          grep -q 'FXQualityToggle' src/client/LobbyNavigator.client.luau
          grep -q 'LocalWaypoint_' src/client/LobbyNavigator.client.luau
          grep -q 'LobbyServiceConfig' src/client/LobbyNavigator.client.luau
          grep -q 'ReducedVFX' src/client/LobbyNavigator.client.luau
          grep -q 'ReducedVFX' src/client/OverlordCombatVFX.client.luau
          grep -q 'ReducedVFX' src/client/LobbyMentorVFX.client.luau
          grep -q 'ReducedVFX' src/client/BabylonHallVFX.client.luau
          grep -q 'SellConfirmBackdrop' src/client/TowerHUD.client.luau
          grep -q 'AcceptSell' src/client/TowerHUD.client.luau
          grep -q 'requestSale()' src/client/TowerHUD.client.luau
          grep -q 'InputEnded:Connect' src/client/TowerHUD.client.luau
          grep -q 'touchAimY' src/client/TowerHUD.client.luau
          grep -q 'Enum.KeyCode.One' src/client/TowerHUD.client.luau
          grep -q 'Enum.KeyCode.U' src/client/TowerHUD.client.luau
          grep -q 'AlchemyWindow' src/client/InterfaceVisualPolish.client.luau
          grep -q '13 scene checks' src/client/LobbyStudioAudit.client.luau
          grep -q 'DEMO RELEASE SMOKE OK' src/server/DemoReleaseSmokeTest.server.luau
          if grep -q 'MainWindow' src/client/InterfaceVisualPolish.client.luau; then
            echo "ERRO: visual patch busca janela antiga de Edward"
            exit 1
          fi
          if grep -q 'request:FireServer("Sell", t.Serial)' src/client/TowerHUD.client.luau; then
            echo "ERRO: venda de torre sem confirmacao"
            exit 1
          fi
          if grep -q 'SellConfirmBackdrop' src/server/TowerService.luau; then
            echo "ERRO: UI do cliente nao pode entrar no servidor de torres"
            exit 1
          fi

      - name: Validar resultado da partida e retorno seguro
        run: |
          grep -q 'POST_MATCH_SECONDS=30' src/server/Main.server.luau
          grep -q 'Workspace:SetAttribute("DemoMatchFinished",true)' src/server/Main.server.luau
          grep -q 'DemoMatchFinished' src/client/BetaLobby.client.luau
          grep -q 'SESSÃO FINALIZADA' src/client/BetaLobby.client.luau
          grep -q 'requestReturn.OnServerEvent:Connect(returnPlayerToLobby)' src/server/Main.server.luau
          grep -q 'showResult:FireClient' src/server/Main.server.luau
          grep -q 'player:SetAttribute("InArena",false)' src/server/Main.server.luau
          grep -q 'ReplayAvailable=false' src/server/Main.server.luau
          grep -q 'AnimeFissurePostMatchHUD' src/client/PostMatchHUD.client.luau
          grep -q 'Retorno automático ao lobby em' src/client/PostMatchHUD.client.luau
          grep -q 'ReturnToLobby' src/client/PostMatchHUD.client.luau
          grep -q 'PostMatchRemotes' src/server/DemoReleaseSmokeTest.server.luau

      - name: Check-up final de interface e interacao
        run: |
          grep -Fq 'gui.DisplayOrder=39' src/client/LobbyNavigator.client.luau
          grep -Fq 'gui.AbsoluteSize' src/client/LobbyNavigator.client.luau
          grep -Fq 'setDirectoryVisible' src/client/LobbyNavigator.client.luau
          grep -Fq 'if placementTouch then return end' src/client/TowerHUD.client.luau
          grep -Fq 'WindowFocusReleased' src/client/TowerHUD.client.luau
          grep -Fq 'NPC INTERACTION SMOKE OK' src/server/DemoReleaseSmokeTest.server.luau
          grep -Fq 'TENTAR VOLTAR AO LOBBY' src/client/PostMatchHUD.client.luau

      - name: Gerar arquivo Roblox
        run: |
          mkdir -p build
          rojo build default.project.json \
            --output build/AnimeFissure-Beta.rbxlx

      - name: Verificar resultado
        run: |
          test -s build/AnimeFissure-Beta.rbxlx
          grep -q 'FissureLoading' build/AnimeFissure-Beta.rbxlx
          grep -q 'GroundedWorld' build/AnimeFissure-Beta.rbxlx
          grep -q 'LobbyNavigator' build/AnimeFissure-Beta.rbxlx
          grep -q 'DemoReleaseSmokeTest' build/AnimeFissure-Beta.rbxlx
          grep -q 'TowerHUD' build/AnimeFissure-Beta.rbxlx
          grep -q 'PostMatchHUD' build/AnimeFissure-Beta.rbxlx
          grep -q 'BabylonHallBuilder' build/AnimeFissure-Beta.rbxlx
          grep -q 'LobbyNPCArtFinish' build/AnimeFissure-Beta.rbxlx
          ls -lh build/AnimeFissure-Beta.rbxlx

      - name: Disponibilizar build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeFissure-Beta
          path: build/AnimeFissure-Beta.rbxlx
          if-no-files-found: error
          retention-days: 30
